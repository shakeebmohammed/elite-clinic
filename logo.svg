<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" role="img" aria-label="Elite Children, Skin and Hair Clinic">

  <!-- ===== BACKGROUND (white) ===== -->
  <rect width="380" height="90" fill="white"/>

  <!-- ============================================================
       2x2 ICON GRID — matches signage exactly
       Each square: 38x38, rounded corners r=5
       Grid starts at x=4, y=6
       Gap between squares: 3px
  ============================================================ -->

  <!-- TOP-LEFT: Orange square — Baby face -->
  <rect x="4" y="6" width="38" height="38" rx="5" fill="#F5A623"/>
  <!-- Baby head (white circle) -->
  <circle cx="23" cy="22" r="13" fill="white"/>
  <!-- Eyes -->
  <circle cx="18.5" cy="20" r="2" fill="#F5A623"/>
  <circle cx="27.5" cy="20" r="2" fill="#F5A623"/>
  <!-- Smile -->
  <path d="M18 26 Q23 31 28 26" stroke="#F5A623" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Ears -->
  <circle cx="10" cy="22" r="3" fill="white"/>
  <circle cx="36" cy="22" r="3" fill="white"/>
  <!-- Hair tuft on top -->
  <path d="M17 10 Q23 5 29 10" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- TOP-RIGHT: Blue square — Stethoscope -->
  <rect x="45" y="6" width="38" height="38" rx="5" fill="#1A56DB"/>
  <!-- Stethoscope: two ear tubes going up -->
  <line x1="57" y1="14" x2="57" y2="22" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="71" y1="14" x2="71" y2="22" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Ear tips (small circles) -->
  <circle cx="57" cy="13" r="2.5" fill="white"/>
  <circle cx="71" cy="13" r="2.5" fill="white"/>
  <!-- Connecting arc from both tubes down to chest piece -->
  <path d="M57 22 Q57 30 64 32 Q71 30 71 22" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Chest piece tube going down -->
  <line x1="64" y1="32" x2="64" y2="38" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Chest piece circle -->
  <circle cx="64" cy="40" r="4" stroke="white" stroke-width="2" fill="none"/>
  <circle cx="64" cy="40" r="1.5" fill="white"/>

  <!-- BOTTOM-LEFT: Blue square — Medical Cross -->
  <rect x="4" y="47" width="38" height="38" rx="5" fill="#1A56DB"/>
  <!-- Thick white plus/cross -->
  <rect x="20" y="53" width="6" height="26" rx="2" fill="white"/>
  <rect x="12" y="61" width="22" height="6" rx="2" fill="white"/>

  <!-- BOTTOM-RIGHT: Orange/peach square — Woman face (side profile) -->
  <rect x="45" y="47" width="38" height="38" rx="5" fill="#F5A623"/>
  <!-- Face circle (white) -->
  <circle cx="64" cy="60" r="11" fill="white"/>
  <!-- Eye -->
  <circle cx="68" cy="57" r="1.8" fill="#F5A623"/>
  <!-- Eyebrow -->
  <path d="M65 54 Q68 52 71 54" stroke="#F5A623" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M70 60 Q72 63 70 65" stroke="#F5A623" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Lips -->
  <path d="M66 68 Q68 70 70 68" stroke="#F5A623" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- Hair (dark orange shape over top of head) -->
  <path d="M54 58 Q54 48 64 48 Q74 48 74 58 Q74 52 64 50 Q54 52 54 58Z" fill="#E8920A"/>
  <!-- Neck -->
  <rect x="61" y="70" width="6" height="8" rx="2" fill="white"/>
  <!-- Shoulder hint -->
  <path d="M55 82 Q55 76 64 76 Q73 76 73 82" fill="white"/>

  <!-- ============================================================
       ELITE WORDMARK — heavy, dark navy, condensed
       Positioned to the right of the icon grid
  ============================================================ -->
  <text
    x="92" y="52"
    font-family="'Arial Black', 'Franklin Gothic Heavy', 'Impact', sans-serif"
    font-size="50"
    font-weight="900"
    fill="#0D2B8E"
    letter-spacing="-1">ELITE</text>

  <!-- ============================================================
       BLUE BANNER — "CHILDREN SKIN AND HAIR CLINIC"
       Solid blue rectangle, white bold text
  ============================================================ -->
  <rect x="92" y="58" width="284" height="24" rx="3" fill="#1A56DB"/>
  <text
    x="234" y="74"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="11.5"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    letter-spacing="0.8">CHILDREN SKIN AND HAIR CLINIC</text>

</svg>
